<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Muriale's Kitchen Operations</title>
<link rel="icon" type="image/png" sizes="256x256" href="app-icon.png?v=2">
<link rel="stylesheet" href="app.css">
</head>
<body>
<aside>
  <img src="logo.png" alt="Muriale's Italian Kitchen">
  <nav id="nav"></nav>
</aside>
<main>
  <header>
    <div><h1>Muriale's Kitchen Operations</h1><p id="subtitle"></p></div>
    <div class="pictos" id="pictos"></div>
  </header>
  <div class="flag"></div>
  <section id="view"></section>
</main>
<div id="modal"></div>
<div id="preview">
  <div class="top">
    <strong id="pvTitle" class="grow"></strong>
    <span id="pvNote" class="hint"></span>
    <button class="btn green" data-act="pv-print"></button>
    <button class="btn" data-act="pv-save"></button>
    <button class="btn wine" data-act="pv-close"></button>
  </div>
  <iframe id="pvFrame" title="Print preview"></iframe>
</div>
<div id="toast"></div>
<div id="lost">Muriale's Kitchen Operations has stopped. Close this window and open the program again.</div>

<script src="pdf-lib.min.js"></script>
<script src="js/core.js"></script>
<script src="js/about.js"></script>
<script src="js/calendar.js"></script>
<script src="js/chem.js"></script>
<script src="js/cleaning.js"></script>
<script src="js/corrective.js"></script>
<script src="js/handoff.js"></script>
<script src="js/lock.js"></script>
<script src="js/maint.js"></script>
<script src="js/oos.js"></script>
<script src="js/readiness.js"></script>
<script src="js/registry.js"></script>
<script src="js/reports.js"></script>
<script src="js/sds.js"></script>
<script src="js/sds_print.js"></script>
<script src="js/settings.js"></script>
<script src="js/temps.js"></script>
<script src="js/todo.js"></script>
<script src="js/training.js"></script>
<script src="js/dashboard.js"></script>
<script src="js/history.js"></script>
<script src="js/problem.js"></script>
<script src="js/start.js"></script>
</body>
</html>
