<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1">
<meta name="theme-color" content="#2c2e33"><link rel="manifest" href="manifest.json"><link rel="icon" href="/favicon.png"><link rel="apple-touch-icon" href="/app-icon.png">
<title>Muriale's Kitchen</title>
<style>
:root{--bg:#2c2e33;--panel:#35383e;--line:#565a62;--text:#f1f1f1;--mute:#b9bcc2;--wine:#8a1626;--green:#1e7d30;--gold:#e0bc6e;--red:#c8202f}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--text);font:17px/1.4 system-ui,Roboto,Arial,sans-serif}
::-webkit-scrollbar{display:none}*{scrollbar-width:none}
header{position:sticky;top:0;z-index:5;display:flex;align-items:center;gap:10px;padding:10px 14px;background:#25272b;border-bottom:3px solid var(--wine)}
header h1{font:700 19px Georgia,serif;margin:0;flex:1}
header button{background:none;border:0;color:var(--text);font-size:15px;padding:8px}
main{padding:14px;max-width:640px;margin:0 auto;padding-bottom:90px}
.tiles{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.tile{text-decoration:none;background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:18px 10px;text-align:center;font-weight:700;font-size:17px;color:var(--text);min-height:92px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px}
.tile small{text-decoration:none;font-weight:400;color:var(--mute);font-size:13px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:12px;margin:10px 0}
input,select,textarea{width:100%;font:inherit;background:#24262a;color:var(--text);border:1px solid #6b6f78;border-radius:8px;padding:12px;min-height:48px}
textarea{min-height:90px}
label{display:block;font-size:14px;color:var(--mute);margin:10px 0 4px}
.btn{display:block;width:100%;border:0;border-radius:10px;padding:15px;font:700 17px inherit;color:#fff;background:var(--green);margin:12px 0}
.btn.alt{background:#4a4d55}.btn.sm{display:inline-block;width:auto;padding:10px 16px;margin:0;font-size:15px}
.row{display:flex;gap:8px;align-items:center}.row>*{flex:1}.row>.fix{flex:none}
.ok{color:#7fd48d}.bad{color:#ff8a93;font-weight:700}.mute{color:var(--mute);font-size:14px}
.bar{position:sticky;bottom:0;margin:14px -14px -90px;padding:10px 14px;background:#25272b;border-top:1px solid var(--line)}.bar .btn{margin:0;max-width:640px;margin:0 auto}
#errbar{position:sticky;top:52px;z-index:8;display:none;background:#5b0c17;border:2px solid var(--red);border-radius:10px;padding:12px 14px;margin-bottom:10px;font-weight:700}
#toast{position:fixed;left:14px;right:14px;bottom:80px;background:#111;border:1px solid var(--gold);border-radius:10px;padding:14px;display:none;z-index:9}#toast.err{border-color:var(--red)}
.tick{display:flex;gap:12px;align-items:flex-start;padding:12px 0;border-bottom:1px solid #45484f}.tick:last-child{border:0}
.tick input{width:30px;height:30px;min-height:0;flex:none;margin-top:2px}
h2{font:700 18px Georgia,serif;margin:16px 0 6px;color:var(--gold)}
</style></head>
<body>
<header><button id="back" style="display:none">‹ Home</button><h1 id="ttl">Muriale's Kitchen</h1><button id="qbtn" style="display:none"></button><button id="who"></button></header>
<main><div id="errbar" onclick="this.style.display='none'"></div><div id="v"></div></main><div id="toast"></div>
<script>
"use strict";
const $=s=>document.querySelector(s), esc=s=>String(s==null?"":s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const V=$("#v"); let toastT;
window.addEventListener("unhandledrejection",e=>toast("Something went wrong: "+((e.reason&&e.reason.message)||e.reason),true));window.addEventListener("error",e=>toast("Something went wrong: "+e.message,true));
function toast(m,err){if(err){const e=$("#errbar");e.innerHTML="⚠ "+esc(m)+'<div class="mute" style="font-weight:400">Nothing was lost on the screen. Tap here to close, fix it and try again.</div>';e.style.display="block";window.scrollTo(0,0);return;}if(m!==QMSG&&Date.now()-qflash<2500)return;$("#errbar").style.display="none";const t=$("#toast");t.textContent=m;t.className=err?"err":"";t.style.display="block";clearTimeout(toastT);toastT=setTimeout(()=>t.style.display="none",m===QMSG?6000:err?7000:2800);}
async function api(p,o){let r;try{r=await fetch(p,o);}catch(e){const x=new Error("Could not reach the kitchen computer. Check the Wi-Fi and that Kitchen Ops is open on it.");x.net=true;throw x;}const j=await r.json().catch(()=>({}));if(!r.ok)throw new Error(j.error||"That did not work. Try again.");return j;}
const QLAB={"/api/temps":"Temperatures","/api/parcheck":"Par check","/api/dw/tick":"Workflow check","/api/reg/breakage":"Breakage","/api/notes":"Handoff note","/api/clean/done":"Cleaning done","/api/clean/deepdone":"Deep clean done","/api/mgr/done":"Manager check","/api/walk":"Walkthrough","/api/maint/todos":"New to-do"};
const QMSG="No Wi-Fi right now. Saved on this phone. It will send by itself as soon as the connection is back.";let qflash=0,flushing=false;
const Q={get(k){try{return JSON.parse(localStorage.getItem(k||"kq")||"[]")}catch(e){return []}},set(a,k){try{localStorage.setItem(k||"kq",JSON.stringify(a))}catch(e){}showQ();}};
function qlabel(p){return QLAB[p]||(/\/pm\/.*\/done$/.test(p)?"Maintenance done":/\/todos\/.*\/done$/.test(p)?"To-do done":"Entry");}
function qtime(at){return new Date(at).toLocaleTimeString([],{hour:"numeric",minute:"2-digit"});}
function showQ(){const w=Q.get().length,f=Q.get("kqf").length,b=$("#qbtn");if(!b)return;b.style.display=w||f?"":"none";b.className=f?"bad":"";b.textContent=f?"⚠ "+f+" not sent":"⏳ "+w+" waiting";}
async function flushQ(){if(flushing)return;flushing=true;try{for(;;){const a=Q.get();if(!a.length)break;const it=a[0];let r;
  try{r=await fetch(it.p,{method:"POST",headers:{"Content-Type":"application/json","X-Queue-Id":it.id,"X-Queued-At":String(it.at)},body:JSON.stringify(it.b)});}catch(e){break;}
  const rest=Q.get().filter(x=>x.id!==it.id);
  if(r.ok){Q.set(rest);qdone=true;}else{const j=await r.json().catch(()=>({}));it.err=j.error||"The computer refused it.";Q.set(rest);Q.set(Q.get("kqf").concat([it]),"kqf");}}
  }finally{flushing=false;showQ();if(qdone){qdone=false;if(!Q.get().length)toast("Saved entries were sent to the kitchen computer.");}}}
let qdone=false;
function qpanel(){const w=Q.get(),f=Q.get("kqf");let d=$("#qpanel");if(!d){d=document.createElement("div");d.id="qpanel";d.style.cssText="position:fixed;inset:0;z-index:20;background:rgba(0,0,0,.7);padding:14px;overflow:auto";document.body.appendChild(d);}
  d.innerHTML=`<div class="card" style="max-width:640px;margin:30px auto"><h2 style="margin-top:0">Waiting to send</h2>${w.length?w.map(x=>`<div class="tick"><div>${esc(qlabel(x.p))} <span class="mute">entered ${qtime(x.at)}${x.b&&x.b.by?" by "+esc(x.b.by):""}</span></div></div>`).join(""):'<p class="mute">Nothing waiting.</p>'}
  ${f.length?`<h2>Could not be sent</h2>${f.map((x,i)=>`<div class="tick"><div><b>${esc(qlabel(x.p))}</b> <span class="mute">entered ${qtime(x.at)}</span><div class="bad">${esc(x.err)}</div><button class="btn alt sm" data-q="${i}">Discard</button></div></div>`).join("")}`:""}
  <button class="btn" id="qnow">Try to send now</button><button class="btn alt" id="qx">Close</button></div>`;
  $("#qx").onclick=()=>d.remove();$("#qnow").onclick=async()=>{await flushQ();qpanel();};
  d.querySelectorAll("[data-q]").forEach(b=>b.onclick=()=>{const a=Q.get("kqf");a.splice(+b.dataset.q,1);Q.set(a,"kqf");qpanel();});}
async function post(p,b){const id=Date.now().toString(36)+Math.random().toString(36).slice(2,8),at=Date.now();
  try{const r=await api(p,{method:"POST",headers:{"Content-Type":"application/json","X-Queue-Id":id,"X-Queued-At":String(at)},body:JSON.stringify(b)});$("#errbar").style.display="none";return r;}
  catch(e){if(!e.net)throw e;Q.set(Q.get().concat([{id,p,b,at}]));qflash=Date.now();toast(QMSG);return {queued:true,id:"(waiting to send)",need:[],findings:0};}}
function me(){try{return localStorage.getItem("kname")||""}catch(e){return ""}}
function setMe(v){const n=(v||"").trim().split(/\s+/)[0]||"";const t=n?n[0].toUpperCase()+n.slice(1):"";try{localStorage.setItem("kname",t)}catch(e){}$("#who").textContent=t?"👤 "+t:"Who?";return t;}
function whoField(){return `<label>Your first name</label><input id="by" value="${esc(me())}" autocomplete="off" autocapitalize="words" placeholder="First name">`;}
function needBy(){const v=setMe($("#by").value);if(!v){toast("Type your first name.",true);$("#by").focus();return "";}return v;}
const today=()=>{const d=new Date();return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0");};
const SCREENS={home,temps,par,work,clean,todo,walk,brk,note,attn,chk,guide,sds};
async function route(){V.oninput=V.onchange=V.onclick=null;$("#errbar").style.display="none";const h=(location.hash||"#home").slice(1);const [name,arg]=h.split("/");$("#back").style.display=name==="home"?"none":"";setMe(me());
  try{await (SCREENS[name]||home)(decodeURIComponent(arg||""));}catch(e){V.innerHTML=`<div class="card bad">${esc(e.message)}</div><button class="btn alt" onclick="route()">Try again</button>`;}}
document.addEventListener("click",e=>{const b=e.target.closest(".bar .btn");if(!b)return;if(b.dataset.busy){e.stopImmediatePropagation();e.preventDefault();return;}b.dataset.busy="1";setTimeout(()=>{delete b.dataset.busy;},2500);},true);
window.addEventListener("hashchange",route);$("#back").onclick=()=>location.hash="home";
$("#who").onclick=()=>{const n=prompt("Your first name",me());if(n!==null){setMe(n);}};
function title(t){$("#ttl").textContent=t;}

function home(){title("Muriale's Kitchen");
  V.innerHTML=`<div class="tiles">
  <a class="tile" href="#temps">🌡️<span>Temperatures</span></a>
  <a class="tile" href="#par">✅<span>Par Check</span></a>
  <a class="tile" href="#work">📋<span>Today's Workflow</span></a>
  <a class="tile" href="#clean">🧽<span>Cleaning</span></a>
  <a class="tile" href="#todo">🛠️<span>To-Do &amp; Maintenance</span></a>
  <a class="tile" href="#brk">🥣<span>Log Breakage</span></a>
  <a class="tile" href="#walk">🔍<span>Facility Walkthrough</span></a>
  <a class="tile" href="#note">📝<span>Handoff Notes</span><small id="nn">Read and leave notes</small></a>
  <a class="tile" href="#chk">☑️<span>Station Checklists</span></a>
  <a class="tile" href="#guide">📖<span>Station Guides</span></a>
  <a class="tile" href="#sds">🧪<span>SDS Lookup</span></a>
  <a class="tile" href="#attn">⚠️<span>Needs Attention</span><small id="na">&nbsp;</small></a></div>
  <p class="mute" style="text-align:center;margin-top:20px">${esc(new Date().toDateString())}</p>`;
  api("/api/phone/attention").then(d=>{const n=(d.items||[]).length+(d.alerts||[]).length,m=(d.notes||[]).length;if($("#na"))$("#na").innerHTML=n?`<b class="bad">${n} to look at</b>`:'<span class="ok">All clear</span>';if($("#nn")&&m)$("#nn").textContent=m+" open note"+(m>1?"s":"");}).catch(()=>{});}

let tempMsg="";
function lim(p,kinds){const k=(kinds.find(x=>x.kind===p.kind)||{});const own=p.min!=null||p.max!=null;return {min:own?p.min:k.min,max:own?p.max:k.max};}
function limText(l){return l.min!=null&&l.max!=null?l.min+"° to "+l.max+"°":l.max!=null?l.max+"° or below":l.min!=null?l.min+"° or above":"";}
function stat(l,v){if(isNaN(v))return "";if(l.max!=null&&v>l.max)return "warm";if(l.min!=null&&v<l.min)return "cold";return "ok";}
async function temps(){title("Temperatures");const d=await api("/api/temps");const t=today();
  const done={};(d.readings||[]).forEach(r=>{if((r.at||"").slice(0,10)===t)done[r.pointId]=r;});
  const L={};d.points.forEach(p=>L[p.id]=lim(p,d.kinds));
  const groups={};d.points.forEach(p=>(groups[p.area||p.kind||"Other"]=groups[p.area||p.kind||"Other"]||[]).push(p));
  if(!d.points.length){V.innerHTML=`<div class="card">No temperature points are set up yet. Add them on the computer in Settings.</div>`;return;}
  V.innerHTML=(tempMsg?`<div class="card" style="border-color:${/OUT OF RANGE/.test(tempMsg)?"var(--red)":"var(--green)"}">${tempMsg}</div>`:"")+whoField()+Object.entries(groups).map(([g,ps])=>`<h2>${esc(g)}</h2>`+ps.map(p=>{const r=done[p.id];const bad=r&&(r.status==="Too Warm"||r.status==="Too Cold");
    return `<div class="card" data-p="${esc(p.id)}"><div class="row"><b>${esc(p.name)}</b><span class="mute fix">${esc(limText(L[p.id]))}</span></div>
    ${r?`<div class="${bad?"bad":"ok"} mute">Logged today: ${esc(r.temp)}°F at ${esc(r.at.slice(11))} by ${esc(r.by)}${bad?" - OUT OF RANGE":""}</div>`:""}
    <div class="row" style="margin-top:6px"><button type="button" class="btn alt sm fix neg" style="min-width:64px;font-size:22px">±</button><input class="tv" type="text" inputmode="decimal" autocomplete="off" placeholder="°F"></div>
    <div class="st" style="margin-top:6px;font-weight:700"></div>
    <input class="ta" style="display:none;margin-top:8px" placeholder="Enter Corrective Action"></div>`;}).join("")).join("")+`<div class="bar"><button class="btn" id="go">Save Temperatures</button></div>`;
  tempMsg="";
  const num=c=>parseFloat(c.querySelector(".tv").value.replace(/[−–]/g,"-"));
  const upd=c=>{const v=num(c),s=stat(L[c.dataset.p],v),st=c.querySelector(".st"),ta=c.querySelector(".ta");
    st.textContent=s==="ok"?"✔ OK":s==="warm"?"✖ TOO WARM - Enter Corrective Action":s==="cold"?"✖ TOO COLD - Enter Corrective Action":"";st.className="st "+(s==="ok"?"ok":s?"bad":"");ta.style.display=s&&s!=="ok"?"block":"none";};
  V.oninput=e=>{const c=e.target.closest("[data-p]");if(c&&e.target.classList.contains("tv"))upd(c);};
  V.onclick=e=>{const b=e.target.closest(".neg");if(!b)return;const i=b.parentNode.querySelector(".tv");i.value=i.value.startsWith("-")?i.value.slice(1):"-"+i.value;i.focus();upd(b.closest("[data-p]"));};
  $("#go").onclick=async()=>{const by=needBy();if(!by)return;const cards=[...V.querySelectorAll("[data-p]")].filter(c=>!isNaN(num(c)));
    if(!cards.length){toast("Enter at least one temperature.",true);return;}
    const rows=[],badList=[];for(const c of cards){const v=num(c),s=stat(L[c.dataset.p],v),a=c.querySelector(".ta").value.trim(),name=c.querySelector("b").textContent;
      if(s&&s!=="ok"){if(!a){c.querySelector(".ta").focus();toast(name+" is out of range. Enter Corrective Action.",true);return;}badList.push(name+" "+v+"°F");}
      rows.push({pointId:c.dataset.p,temp:v,action:s&&s!=="ok"?a:""});}
    try{const pr=await post("/api/temps",{by,readings:rows});
      tempMsg=pr.queued?`<b class="ok">No Wi-Fi: ${rows.length} reading${rows.length>1?"s":""} saved on this phone.</b><br><span class="mute">They will send by themselves when the connection is back.</span>`:badList.length?`<b class="bad">OUT OF RANGE (${badList.length}):</b><br>${badList.map(esc).join("<br>")}<br><span class="mute">Corrective action saved.</span>`:`<b class="ok">Saved ${rows.length} reading${rows.length>1?"s":""}. All in range.</b>`;
      window.scrollTo(0,0);temps();}
    catch(e){toast(e.message,true);}};}

async function par(st){if(!st){title("Par Check");const d=await api("/api/parcheck");V.innerHTML=`<p class="mute">Pick your station.</p><div class="tiles">${d.stations.map(s=>`<a class="tile" href="#par/${encodeURIComponent(s)}">${esc(s)}</a>`).join("")}</div>`;return;}
  title(st+" Par Check");const d=await api("/api/parcheck?station="+encodeURIComponent(st));const c=d.check||{};const On=c.on||{},Mk=c.make||{},In=c.init||{};
  V.innerHTML=whoField()+(c.by?`<div class="ok mute">Already checked today by ${esc(c.by)} at ${esc(c.time)}. You can update it.</div>`:"")+d.items.map(i=>`<div class="card" data-i="${esc(i.id)}"><b>${esc(i.item)}</b> <span class="mute">PAR: ${esc(i.par||"-")}</span>
    <div class="row" style="margin-top:6px"><div><label>On hand</label><input class="on" value="${esc(On[i.id]||"")}"></div><div><label>Make / order</label><input class="mk" value="${esc(Mk[i.id]||"")}"></div></div></div>`).join("")+
    (d.notes.length?`<h2>Notes</h2>${d.notes.map(n=>`<p class="mute">${esc(n)}</p>`).join("")}`:"")+`<div class="bar"><button class="btn" id="go">Save Par Check</button></div>`;
  $("#go").onclick=async()=>{const by=needBy();if(!by)return;const rows=[...V.querySelectorAll("[data-i]")].map(c=>({id:c.dataset.i,on:c.querySelector(".on").value,make:c.querySelector(".mk").value,init:by}));
    try{await post("/api/parcheck",{station:st,by,rows});toast("Par check saved.");location.hash="par";}catch(e){toast(e.message,true);}};}

async function work(){title("Today's Workflow");const d=await api("/api/dw/today");
  V.innerHTML=whoField()+`<p class="mute" id="cnt">${d.done} of ${d.total} done</p>`+d.blocks.map(b=>`<h2>${esc(b.block)} <span class="mute">${esc(b.start||"")}${b.end?" - "+esc(b.end):""}</span></h2><div class="card">${b.items.map(i=>`<label class="tick" style="margin:0;color:var(--text);font-size:17px"><input type="checkbox" data-i="${esc(i.id)}" ${i.done?"checked":""}><span>${esc(i.text)}${i.done&&i.by?`<br><span class="mute">${esc(i.by)} ${esc(i.time||"")}</span>`:""}</span></label>`).join("")}</div>`).join("");
  V.onchange=async e=>{const el=e.target;if(!el.dataset.i)return;const by=setMe($("#by").value);if(!by){el.checked=!el.checked;toast("Type your first name first.",true);return;}
    try{await post("/api/dw/tick",{Date:d.date,ItemID:el.dataset.i,By:by,On:el.checked});}catch(err){el.checked=!el.checked;toast(err.message,true);}};}

async function brk(){title("Log Breakage");const d=await api("/api/reg/breakage");const f={};d.def.fields.forEach(x=>f[x.key]=x);
  const sel=(k,dv)=>`<select id="b-${k}">${(f[k].opts||[]).map(o=>`<option ${o===dv?"selected":""}>${esc(o)}</option>`).join("")}</select>`;
  V.innerHTML=whoField()+`<label>Area</label>${sel("area")}<label>What broke or went missing?</label><input id="b-item" placeholder="Item, e.g. 6 qt cambro">
  <label>Issue</label>${sel("issueType")}<label>Quantity</label><input id="b-qty" inputmode="numeric" value="1"><label>Cause (optional)</label><select id="b-cause"><option value=""></option>${(f.cause.opts||[]).map(o=>`<option>${esc(o)}</option>`).join("")}</select>
  <label>Replacement needed?</label><select id="b-replace">${(f.replace.opts||["Yes","No"]).map(o=>`<option>${esc(o)}</option>`).join("")}</select><label>Notes</label><textarea id="b-notes"></textarea>
  <div class="bar"><button class="btn" id="go">Save Breakage</button></div>`;
  $("#go").onclick=async()=>{if(!$("#b-area"))return;const by=needBy();if(!by)return;const g=k=>$("#b-"+k).value.trim();
    try{await post("/api/reg/breakage",{date:today(),area:g("area"),item:g("item"),issueType:g("issueType"),qty:g("qty"),cause:g("cause"),by,replace:g("replace"),notes:g("notes"),status:(f.status.opts||["Open"])[0]});toast("Logged.");location.hash="home";}catch(e){toast(e.message,true);}};}


function expandList(items,render,onDone){ // rows that open to a small form with a Done button
  return items.map((it,i)=>`<div class="card" data-x="${i}"><div class="tick" style="border:0;padding:0;cursor:pointer" data-open="${i}"><span style="flex:1"><b>${esc(it.title)}</b><br><span class="mute">${esc(it.sub||"")}</span></span>${it.badge?`<span class="${it.bad?"bad":"mute"}">${esc(it.badge)}</span>`:""}</div><div class="more" style="display:none">${render(it,i)}</div></div>`).join("");
}
function wireList(items,onDone){
  V.onclick=async e=>{const o=e.target.closest("[data-open]");if(o){const m=o.parentNode.querySelector(".more");m.style.display=m.style.display==="none"?"block":"none";return;}
    const b=e.target.closest("[data-done]");if(!b||b.disabled)return;const card=b.closest("[data-x]"),it=items[+card.dataset.x];const by=needBy();if(!by)return;
    b.disabled=true;b.textContent="Saving...";try{await onDone(it,by,card);toast("Saved.");route();}catch(err){toast(err.message,true);b.disabled=false;b.textContent="Done";}};
}
async function clean(){title("Cleaning");const d=await api("/api/clean/today");const items=[];
  const sec=(label,list,kind,f)=>list.forEach(x=>items.push({kind,label,...f(x)}));
  sec("Cleaning",d.tasks.filter(x=>x.state!=="Upcoming"),"task",x=>({id:x.id,title:x.area+": "+x.task,sub:[x.timing,x.role].filter(Boolean).join(" · ")+(x.verify==="Yes"?" · manager verifies":""),badge:x.state,bad:x.state==="Overdue",done:x.state==="Done Today"}));
  sec("Weekly deep clean",(d.deep||[]),"deep",x=>({id:x.id,title:x.area+": "+x.task,sub:[x.day,x.role].filter(Boolean).join(" · "),badge:x.state,bad:x.state==="Overdue",done:x.state==="Done Today"}));

      <details style="margin-top:6px"><summary>Emergency summary</summary>${[["Hazards",p.hazards],["Eyes",p.eyes],["Skin",p.skin],["Breathed in",p.inhalation],["Swallowed",p.swallowed],["Protective gear",p.ppe]].filter(x=>x[1]).map(x=>`<p style="margin:6px 0"><b>${x[0]}:</b> ${esc(x[1])}</p>`).join("")||'<p class="mute">No summary entered. Open the sheet.</p>'}</details>
      ${p.missing?'<div class="bad">The PDF is missing from the folder.</div>':`<a class="btn sm" style="text-decoration:none;margin-top:8px" href="/api/phone/sds/${encodeURIComponent(p.id)}/pdf" target="_blank">Open Full Sheet (PDF)</a>`}</div>`).join(""):'<p class="mute">Nothing matches that.</p>';};
  let tm;$("#sq").oninput=()=>{clearTimeout(tm);tm=setTimeout(draw,250);};draw();}

$("#qbtn").onclick=qpanel;showQ();flushQ();setInterval(flushQ,15000);window.addEventListener("online",flushQ);document.addEventListener("visibilitychange",()=>{if(!document.hidden)flushQ();});
route();
</script></body></html>
